; Fixed SoftPC machine configuration. This file must stay beside softpc32.exe
; and softpc64.exe. Relative disk-image paths are resolved from this directory.
memory_mb=16
floppy=..\media\msdos622_en_boot.img
; Installed Windows 3.1 system disk used for standalone VM validation.
; The guest selects and loads its own Windows mouse driver; the VM exposes
; only the original InPort hardware.
hard_disk=..\media\win31_en_installed.img
display=window
media_mode=overlay
; Optional original-controller output endpoints. Empty/unset retains virtual sinks.
serial_output=
printer_output=
